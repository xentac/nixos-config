# Who can decrypt which secrets files. Two kinds of recipients:
#   - admin:  Jason's personal age key (~/.config/sops/age/keys.txt) — the
#             editing key. Back it up in a password manager; without it you
#             can't edit secrets (hosts can still decrypt).
#   - hosts:  each machine's SSH host key, converted to age format with
#             `ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub`. This is what
#             lets the machine decrypt unattended at activation.
#
# Adding a host later: convert its pubkey, add an anchor here, list it in the
# right rule, then run `sops updatekeys secrets/<file>.yaml` to re-encrypt.
keys:
  - &admin age1t7edkdrvclrdg80enffqxwqde2cacs6d9zrxuyn22ghleksf4slqgkyyh4
  - &donatello age1zc9zgppjymt22ux952kuhuhnk6lspe64awht77tsyq68ztes7ass9r906f
  - &alba-nix age1khjlhurtjl46fyll8h93fyqnwwp89hdmtjgwljcu5wyh99gfyypqgxvy6x
  # TODO(alba-nix install): after nixos-anywhere finishes, run
  #   ssh root@192.168.1.23 ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub
  # then add the result as &alba-nix below, list it in the alba-nix rule,
  # and `sops updatekeys secrets/alba-nix.yaml`. Until then only the admin
  # key can decrypt that file, so the first deploy with real secrets comes
  # after this step (see docs/alba-nix.md).
creation_rules:
  - path_regex: secrets/donatello\.yaml$
    key_groups:
      - age:
          - *admin
          - *donatello
  - path_regex: secrets/alba-nix\.yaml$
    key_groups:
      - age:
          - *admin
          - *alba-nix
